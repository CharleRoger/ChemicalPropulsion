// A multiplier of 0.03 and an exponent of 0.04 should yield about the same tank densities computed by SMURFF.
// See ChemicalCore/Patches/chemical-core-settings.cfg for more information
@ChemicalCoreSettings:NEEDS[SMURFF]:BEFORE[zz_ChemicalCore]
{
	TankDensityMultiplierRatio = 0.03
	@TankDensityMultiplierRatio /= #$TankDensityMultiplier$
	@TankDensityMultiplierRatio != #$@SMURFFCONFIG/tanklever$
	@TankDensityMultiplier *= #$TankDensityMultiplierRatio$

	TankDensityExponentDifference = 0.04
	@TankDensityExponentDifference -= #$TankDensityExponent$
	@TankDensityExponentDifference *= #$@SMURFFCONFIG/tanklever$
	@TankDensityExponent += #$TankDensityExponentDifference$

	@TankDensityRoundingFactor = 0.000625
}

// Tank mass manipulation is handled by ChemicalPropulsion\Patches\Misc\chemical-propulsion-tanks.cfg using the parameters defined above
@PART:HAS[#ppuTank[true]]:NEEDS[SMURFF]:FOR[zzz_ChemicalPropulsion]
{
	%SMURFFExclude = true
}

// Bipropellant engines
@PART:HAS[@MODULE[ModuleIgnitionEngineController],@MODULE[ModuleEngines*]:HAS[#chemTechOxidizer]]:NEEDS[SMURFF]:FOR[zzz_ChemicalPropulsion]
{
	%SMURFFExclude = true
	@MODULE[ModuleEngines*]:HAS[#chemTechOxidizer],*
	{
		@maxThrust *= #$@SMURFFCONFIG/enginethrustfactor$
	}
}
@PART:HAS[@MODULE[ModuleIgnitionEngineController],@MODULE[ModuleEngines*]:HAS[#chemTechOxidizer],!MODULE[ModuleCommand],~CrewCapacity[>0],!MODULE[ModuleCargoBay]]:NEEDS[SMURFF]:FOR[zzz_ChemicalPropulsion]
{
	%SMURFFExclude = true
	@mass *= #$@SMURFFCONFIG/enginemassfactor$
}

// Solid rocket engines
// I am ignoring SMURFFCONFIG/solidfactor since the tank dry mass adjustment above seems sufficient to yield roughly the right mass fractions that SMURFF is aiming for
@PART:HAS[@MODULE[ModuleIgnitionEngineController],@MODULE[ModuleEngines*]:HAS[#chemTechPropellant[PBAN]]]:NEEDS[SMURFF]:FOR[zzz_ChemicalPropulsion]
{
	%SMURFFExclude = true
	@MODULE[ModuleEngines*]:HAS[#chemTechPropellant[PBAN]],*
	{
		@maxThrust *= #$@SMURFFCONFIG/enginethrustfactor$
	}
}